name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" | tail -3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/PrincessKitchen-${{ steps.version.outputs.value }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PrincessKitchen-debug-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.value }}
          name: 公主厨房 v${{ steps.version.outputs.value }} · Android APK
          body: |
            自动构建的 debug APK（自签名，可直接侧载安装）。

            - 版本：${{ steps.version.outputs.value }}
            - 安装：手机浏览器打开本页 → 下载 APK → 允许「安装未知应用」→ 安装
            - 内容是离线内置的，不联网也能用；网页版更新后需要重新出包
          files: out/*.apk
          fail_on_unmatched_files: true
